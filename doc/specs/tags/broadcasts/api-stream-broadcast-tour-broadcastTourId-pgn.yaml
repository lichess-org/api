get:
  operationId: broadcastStreamTourPgn
  summary: Stream ongoing broadcast rounds of a tournament as PGN
  description: |
    For a given broadcast tournament ([example](https://lichess.org/broadcast/sparkassen-chess-trophy-2026-open-a/jfEpUuzg)),
    selects all the ongoing and recently finished rounds, and sends all games of these rounds in PGN format.
    Then, it waits for new moves to be played. As soon as it happens, the entire PGN of the game is sent to the stream.
    The stream will also send PGNs when games are added to the rounds.
    This is the best way to get updates about an ongoing broadcast tournament across all its rounds.
    To stream a single round, use [this endpoint instead](#tag/broadcasts/GET/api/stream/broadcast/round/{broadcastRoundId}.pgn).
  tags:
    - Broadcasts
  security:
    - OAuth2: ["study:read"]
  parameters:
    - in: path
      name: broadcastTourId
      description: |
        The broadcast tournament ID. It's the last past of the tournament URL, which can be found on the broadcast page overview section.
        [Example](https://lichess.org/broadcast/sparkassen-chess-trophy-2026-open-a/jfEpUuzg) the tournament URL is 
        https://lichess.org/broadcast/sparkassen-chess-trophy-2026-open-a/jfEpUuzg and therefore the tournament ID is `jfEpUuzg `.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 8
    - in: query
      name: clocks
      description: |
        Include clock comments in the PGN moves, when available.
        Example: `2. exd5 { [%clk 1:01:27] } e5 { [%clk 1:01:28] }`
      schema:
        type: boolean
        default: true
    - in: query
      name: comments
      description: |
        Include analysis comments in the PGN moves, when available.
        Example: `12. Bxf6 { [%eval 0.23] }`
      schema:
        type: boolean
        default: true
  responses:
    "200":
      description: The PGN representation of the rounds games, then the PGNs of games as they are updated.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            default: "'*'"
      content:
        application/x-chess-pgn:
          schema:
            $ref: "../../schemas/BroadcastPgn.yaml"
          examples:
            pgn:
              $ref: "../../examples/broadcasts-streamOngoingBroadcastRoundAsPgn.pgn.yaml"
