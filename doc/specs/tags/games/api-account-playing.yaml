get:
  operationId: apiAccountPlaying
  summary: Get my ongoing games
  description: |
    Get the ongoing games of the current user.
    Real-time and correspondence games are included.
    The most urgent games are listed first.
  tags:
    - Games
  security:
    - OAuth2: []
  parameters:
    - in: query
      name: nb
      description: Max number of games to fetch
      schema:
        type: integer
        default: 9
        minimum: 1
        maximum: 50
  responses:
    "200":
      description: The ongoing games of the logged in user.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            default: "'*'"
      content:
        application/json:
          schema:
            type: object
            required:
              - nowPlaying
              - nbMyTurn
            properties:
              nbMyTurn:
                type: integer
                description: Number of games where it is my turn to play
              nowPlaying:
                type: array
                description: Games I'm currently playing
                items:
                  type: object
                  required:
                    - gameId
                    - fullId
                    - color
                    - fen
                    - hasMoved
                    - isMyTurn
                    - lastMove
                    - opponent
                    - perf
                    - rated
                    - rating
                    - secondsLeft
                    - source
                    - speed
                    - variant
                  properties:
                    fullId:
                      type: string
                    gameId:
                      type: string
                    fen:
                      type: string
                    color:
                      $ref: "../../schemas/GameColor.yaml"
                    lastMove:
                      type: string
                    source:
                      $ref: "../../schemas/GameSource.yaml"
                    status:
                      $ref: "../../schemas/GameStatus.yaml"
                    variant:
                      $ref: "../../schemas/Variant.yaml"
                    speed:
                      $ref: "../../schemas/Speed.yaml"
                    perf:
                      $ref: "../../schemas/PerfType.yaml"
                    rated:
                      type: boolean
                    rating:
                      type: integer
                    hasMoved:
                      type: boolean
                    opponent:
                      required:
                        - id
                        - username
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        rating:
                          type: integer
                        ratingDiff:
                          type: integer
                        ai:
                          type: integer
                    isMyTurn:
                      type: boolean
                    secondsLeft:
                      type: integer
                    tournamentId:
                      type: string
                    swissId:
                      type: string
                    winner:
                      $ref: "../../schemas/GameColor.yaml"
                    ratingDiff:
                      type: integer
            example:
              {
                "nbMyTurn": 0,
                "nowPlaying":
                  [
                    {
                      "color": "black",
                      "fen": "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2",
                      "fullId": "8NaxZT0YAMgv",
                      "gameId": "8NaxZT0Y",
                      "hasMoved": true,
                      "isMyTurn": false,
                      "lastMove": "e7e5",
                      "opponent": { "id": "mary", "rating": 1007, "username": "Mary" },
                      "perf": "blitz",
                      "rated": false,
                      "rating": 1700,
                      "secondsLeft": 300,
                      "source": "friend",
                      "speed": "blitz",
                      "status": { "id": 20, "name": "started" },
                      "variant": { "key": "standard", "name": "Standard" },
                    },
                  ],
              }
