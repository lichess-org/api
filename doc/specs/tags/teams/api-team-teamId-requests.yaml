get:
  operationId: teamRequests
  summary: Get join requests
  description: Get pending join requests of your team
  tags:
    - Teams
  security:
    - OAuth2: ["team:read"]
  parameters:
    - in: path
      name: teamId
      schema:
        type: string
      required: true
    - in: query
      name: declined
      description: Get the declined join requests
      schema:
        type: boolean
        default: false
  responses:
    "200":
      description: The list of pending join requests on your team
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../schemas/TeamRequestWithUser.yaml"

          examples:
            default:
              $ref: "../../examples/teams-getJoinRequests.json.yaml"
