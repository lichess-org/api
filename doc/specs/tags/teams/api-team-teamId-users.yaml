get:
  operationId: teamIdUsers
  summary: Get members of a team
  description: |
    Members are sorted by reverse chronological order of joining the team (most recent first).
    OAuth is only required if the list of members is private.
    Up to 5,000 users are streamed as [ndjson](#description/streaming-with-nd-json).
  tags:
    - Teams
  security:
    - OAuth2: ["team:read"]
  parameters:
    - in: path
      name: teamId
      schema:
        type: string
        example: "coders"
      required: true
    - in: query
      name: full
      description: |
        Full user documents with performance ratings.
        This limits the response to 1,000 users.
      schema:
        type: boolean
        default: false
  responses:
    "200":
      description: The list of users in the team.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            default: "'*'"
      content:
        application/x-ndjson:
          schema:
            type: object
            properties:
              joinedTeamAt:
                type: integer
                format: int64
              id:
                type: string
              name:
                type: string
              flair:
                $ref: "../../schemas/Flair.yaml"
              title:
                $ref: "../../schemas/Title.yaml"
              patron:
                $ref: "../../schemas/Patron.yaml"
              patronColor:
                $ref: "../../schemas/PatronColor.yaml"
              url:
                type: string
                format: uri
            required:
              - id
              - name

          examples:
            default:
              $ref: "../../examples/teams-getMembersOfTeam.json.yaml"
