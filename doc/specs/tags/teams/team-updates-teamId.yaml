get:
  operationId: teamUpdatesByTeamId
  summary: Get updates from one of your teams
  description: |
    Paginator of the most recent updates posted by team leaders of a team you have joined.
  tags:
    - Teams
  security:
    - OAuth2: ["team:read"]
  parameters:
    - in: path
      name: teamId
      schema:
        type: string
        example: coders
      required: true
    - in: query
      name: page
      schema:
        type: integer
        example: 1
        default: 1
  responses:
    "200":
      description: A paginated list of team updates
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            default: "'*'"
      content:
        application/json:
          schema:
            $ref: "../../schemas/TeamUpdatesOfTeam.yaml"
          examples:
            default:
              $ref: "../../examples/teams-updates-of-team.yaml"
