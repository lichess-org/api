post:
  operationId: teamIdPmAll
  summary: Send a team update
  description: |
    Send a team update to all members of a team.
    You must be a team leader with the "Updates" permission.
  tags:
    - Teams
  security:
    - OAuth2: ["team:lead"]
  parameters:
    - in: path
      name: teamId
      schema:
        type: string
        example: "coders"
      required: true
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            message:
              type: string
              description: The message to send to all your team members.
  responses:
    "200":
      description: The update has been posted successfully.
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
            default: "'*'"
      content:
        application/json:
          schema:
            $ref: "../../schemas/Ok.yaml"
    "400":
      description: The update could not be posted.
      content:
        application/json:
          schema:
            $ref: "../../schemas/Error.yaml"
