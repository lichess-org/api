type: object

required:
  - depth
  - fen
  - knodes
  - pvs
properties:
  depth:
    type: integer
  fen:
    type: string
  knodes:
    type: integer
  pvs:
    type: array
    items:
      oneOf:
        - type: object
          title: Non-mate variation
          required:
            - cp
            - moves
          properties:
            cp:
              type: integer
              description: Evaluation in centi-pawns, from White's point of view
            moves:
              type: string
              description: |
                Variation in UCI notation (King to rook for Chess960-compatible
                castling notation)
        - type: object
          title: Mate variation
          required:
            - mate
            - moves
          properties:
            mate:
              type: integer
              description: Evaluation in moves to mate, from White's point of view
            moves:
              type: string
              description: |
                Variation in UCI notation (King to rook for Chess960-compatible
                castling notation)
