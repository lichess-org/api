type: object
properties:
  id:
    type: string
  rated:
    type: boolean
  variant:
    $ref: "./VariantKey.yaml"
  speed:
    $ref: "./Speed.yaml"
  perf:
    $ref: "./PerfType.yaml"
  createdAt:
    type: integer
  status:
    $ref: "./GameStatusId.yaml"
  statusName:
    $ref: "./GameStatusName.yaml"
  clock:
    type: object
    properties:
      initial:
        type: integer
      increment:
        type: integer
      totalTime:
        type: integer
  players:
    type: object
    properties:
      white:
        type: object
        properties:
          userId:
            type: string
          rating:
            type: integer
          provisional:
            type: boolean
      black:
        type: object
        properties:
          userId:
            type: string
          rating:
            type: integer
          provisional:
            type: boolean
  winner:
    $ref: "./GameColor.yaml"

required:
  - id
