oneOf:
  - type: object
    title: Thematic
    properties:
      eco:
        type: string
      name:
        type: string
      fen:
        type: string
      url:
        type: string
        format: uri
    required:
      - eco
      - name
      - fen
      - url
    additionalProperties: false
  - type: object
    title: Custom position
    properties:
      name:
        type: string
        const: "Custom position"
      fen:
        type: string
    required:
      - name
      - fen
    additionalProperties: false
