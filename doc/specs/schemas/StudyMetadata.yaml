type: object

properties:
  id:
    type: string
    description: The study ID
  name:
    type: string
    description: The study name
  createdAt:
    type: integer
    format: int64
    description: The study creation date
  updatedAt:
    type: integer
    format: int64
    description: The study last update date
  topics:
    type: array
    description: The list of topics for the study
    items:
      type: string

required:
  - id
  - name
  - createdAt
  - updatedAt
