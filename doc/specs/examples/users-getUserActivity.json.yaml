          {
            "topicUrl": "https://lichess.org/forum/lichess-feedback/the-rating-title-and-the-value-in-correspondence-chess-are-not-aligned",
            "topicName": "The rating title and the value in correspondence chess are not aligned.",
            "posts":
              [
                {
                  "url": "https://lichess.org/forum/redirect/post/VEZRRjrl",
                  "text": "https://github.com/lichess-org/lila/issues/22270",
                },
              ],
          },
          {
            "topicUrl": "https://lichess.org/forum/lichess-feedback/too-many-black-pieces",
            "topicName": "too many black pieces",
            "posts":
              [
                {
                  "url": "https://lichess.org/forum/redirect/post/07eOQbla",
                  "text": "You have also played 3 out of 4 rapid games as white before.\n\nIf you throw a coin 4 times, you have 50% chances of getting the same result 3 times or more.",
                },
                {
                  "url": "https://lichess.org/forum/redirect/post/YrHWwvrV",
                  "text": "3 in a row would be 3 out of 3, but OP said 3 out of 4.\n\nAnd yes I think it's 50% chances of getting 3 out of 4, or 4 out of 4. Happy to see the reasoning behind 62.5% and admit I'm wrong.",
                },
                {
                  "url": "https://lichess.org/forum/redirect/post/p7t0YmZf",
                  "text": "Lichess random pairings are not actually random. They keep count of how many white/black games everyone plays, and tries to keep everyone at 50%.\nEvery time you play with one color, you increase your chances of getting the other color on next game.\n\nThis prevents the streaks that true random would naturally produce. People don't accept streaks can be random. So to make things feel more random, I had to make them less random. By counting and breaking streaks.\n\nSpotify does the same trick in \"rand",
                },
              ],
          },
        ],
      "stream": true,
    },
